name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Formatting check
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (debug)
        run: cargo test --all-targets

      - name: Tests (release)
        run: cargo test --release

  bindings:
    name: Generate Kotlin + Swift bindings
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Build the FFI cdylib
        run: cargo build -p stream-ffi

      - name: Generate Kotlin bindings
        run: |
          cargo run -p stream-ffi --bin uniffi-bindgen -- \
            generate --language kotlin --no-format \
            --out-dir /tmp/bindings/kotlin \
            --library target/debug/libstream_ffi.so
          test -f /tmp/bindings/kotlin/uniffi/stream_ffi/stream_ffi.kt

      - name: Generate Swift bindings
        run: |
          cargo run -p stream-ffi --bin uniffi-bindgen -- \
            generate --language swift --no-format \
            --out-dir /tmp/bindings/swift \
            --library target/debug/libstream_ffi.so
          test -f /tmp/bindings/swift/stream_ffi.swift

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly + cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo +nightly install cargo-fuzz --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/fuzz

      - name: Build fuzz targets
        run: cargo +nightly fuzz build
        working-directory: core

      - name: Smoke fuzz each target (5s)
        run: |
          for target in chunk_reassembly amf0_decode flv_tag_parser h264_headers aac_headers rtmp_ingest; do
            cargo +nightly fuzz run "$target" -- -max_total_time=5 -runs=1000
          done
        working-directory: core
